name: Actualizar inteligencia pública

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions puede retrasar ejecuciones programadas.
    # Esta frecuencia es orientativa; respeta límites y condiciones de las fuentes.
    - cron: "17,47 * * * *"

permissions:
  contents: read

concurrency:
  group: update-public-data
  cancel-in-progress: false

jobs:
  collect:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Recopilar fuentes públicas
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: python scripts/collect.py

      - name: Publicar cambios de datos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/incidents.json data/history.json
          if git diff --cached --quiet; then
            echo "No hay cambios que guardar."
          else
            git commit -m "Actualizar datos de inteligencia pública"
            git push
          fi
