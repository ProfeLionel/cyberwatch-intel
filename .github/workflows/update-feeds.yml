name: Actualizar feeds de amenazas

on:
  schedule:
    - cron: "0 * * * *"   # cada 1 hora (UTC)
  workflow_dispatch:       # boton para correrlo a mano

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bajar feeds y geolocalizar
        run: python scripts/fetch_feeds.py
        env:
          ABUSECH_AUTH_KEY: ${{ secrets.ABUSECH_AUTH_KEY }}

      - name: Commit si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/events.json
          git diff --staged --quiet || git commit -m "chore: actualizar events.json"
          git push
